@media (max-height:600px){ h1{font-size:clamp(46px,13vw,80px)} .lead{font-size:14px} .cta{padding:13px;margin-top:12px} }

  { const p=startP.clone(), h=startH.clone(), ax=new V3().crossVectors(p,h).normalize(); p.applyAxisAngle(ax,.2); h.applyAxisAngle(ax,.2); chain(p,h,12,0); }
  while(rings.length<RN){ const p=new V3(rnd(-1,1),rnd(-.85,.85),rnd(-1,1)).normalize(); const h=new V3(rnd(-1,1),rnd(-1,1),rnd(-1,1)); h.addScaledVector(p,-h.dot(p)).normalize(); chain(p,h,Math.round(rnd(8,12)),rnd(-.8,.8)); }
}
const mT=new THREE.Matrix4(), vx=new V3(), vy=new V3(), vz=new V3(), vp=new V3();
function ringMatrix(r,scale,out){ vx.crossVectors(r.p,r.h).multiplyScalar(scale); vy.copy(r.p).multiplyScalar(scale); vz.copy(r.h).multiplyScalar(scale);
  vp.copy(r.p).multiplyScalar(R+ALT); return out.makeBasis(vx,vy,vz).setPosition(vp); }
function updateRings(time){
  for(let i=0;i<RN;i++){ const r=rings[i]; const s=r.s*(1+.07*Math.sin(time*5+i)); ringMatrix(r,Math.max(.0001,s),mT); ringMesh.setMatrixAt(i,mT); ringGlow.setMatrixAt(i,mT); }
  ringMesh.instanceMatrix.needsUpdate=true; ringGlow.instanceMatrix.needsUpdate=true;
}

const UP=new V3(0,1,0);
function labelTex(c){ const cv=document.createElement('canvas'); cv.width=640; cv.height=176; const g=cv.getContext('2d');
  g.font='900 78px '+F_JP; g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
  const t=c.emoji+' '+c.jp; g.lineWidth=16; g.strokeStyle='rgba(6,21,51,.9)'; g.strokeText(t,320,74); g.fillStyle='#fff'; g.fillText(t,320,74);
  g.font='italic 800 40px '+F_NUM; g.fillStyle='#FFD23F'; g.lineWidth=10; g.strokeText(c.en,320,144); g.fillText(c.en,320,144);
  return new THREE.CanvasTexture(cv); }
function buildCities(){
  cities.forEach(c=>{
    const q=new THREE.Quaternion().setFromUnitVectors(UP,c.p);
    c.beam=new THREE.Mesh(new THREE.CylinderGeometry(1.1,.35,17,14,1,true),new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    c.beam.position.copy(c.p).multiplyScalar(R+8.5); c.beam.quaternion.copy(q); scene.add(c.beam);
    c.disc=new THREE.Mesh(new THREE.RingGeometry(1.5,2.3,40),new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
    c.disc.position.copy(c.p).multiplyScalar(R+.12); c.disc.quaternion.copy(q).multiply(new THREE.Quaternion().setFromAxisAngle(new V3(1,0,0),-Math.PI/2)); scene.add(c.disc);
    c.label=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(c),transparent:true,depthWrite:false}));
    c.label.position.copy(c.p).multiplyScalar(R+19.5); c.label.scale.set(15,4.1,1); scene.add(c.label);

function paintCity(c){ const v=c.visited; c.beam.material.color.set(v?0x7fd8ff:0xffd23f); c.beam.material.opacity=v?.16:.5; c.disc.material.color.set(v?0x9fe2ff:0xffd23f); c.disc.material.opacity=v?.45:.9; c.label.visible=!v; }

const S={mode:'title',t:0,time:0,left:GAME_SEC,w:0,dist:0,steer:0,steerT:0,bank:0,combo:0,comboT:0,maxCombo:0,maxW:0,punch:0,visited:1,slow:1,countN:-1,fin:0};
const P=startP.clone(), Hd=startH.clone();
const ax=new V3(), right=new V3(), pos=new V3(), camP=new V3(), camL=new V3(), tA=new V3(), tB=new V3();
const camFrom={p:new V3(),q:new THREE.Quaternion()}, qTo=new THREE.Quaternion();
const mRoll=new THREE.Matrix4(), PS=1.7;
let fovBase=70;
function resize(){
  const w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; fovBase=w<h?86:66; camera.fov=fovBase; camera.updateProjectionMatrix();
  const mm=$('#mm'), r=mm.getBoundingClientRect(), d=Math.min(2,window.devicePixelRatio||1); if(r.width>10){ mm.width=Math.round(r.width*d); mm.height=Math.round(r.height*d); }
}
function show(id,on){ $('#'+id).classList.toggle('on',on); }
function titleCam(t){
  const a=t*.06+2.2, portrait=camera.aspect<1, d=R*(portrait?4.3:3.3);
  camera.position.set(Math.cos(a)*d,R*.55,-Math.sin(a)*d); camera.up.set(0,1,0); camera.lookAt(0,0,0);
  if(portrait) camera.translateY(R*1.05); else camera.translateX(-R*1.25);
  camera.fov=portrait?60:46; camera.updateProjectionMatrix();
}
function chaseCam(k,apply){
  const pt=camera.aspect<1;
  camP.copy(P).multiplyScalar(R+ALT+(pt?8.4:6.6)+k*1.6).addScaledVector(Hd,-(9.5+k*3));
  camL.copy(P).multiplyScalar(R+ALT-(pt?6.2:3.4)).addScaledVector(Hd,pt?11:13);
  if(apply){ camera.position.copy(camP);
    if(!reduce&&k>.35){ const a=(k-.35)*.09; camera.position.x+=rnd(-a,a); camera.position.y+=rnd(-a,a); camera.position.z+=rnd(-a,a); }
    camera.up.copy(P); camera.lookAt(camL); camera.rotateZ(-S.bank*(reduce?.12:.38)); }
}
function placePlane(){
  pos.copy(P).multiplyScalar(R+ALT+Math.sin(S.time*2.2)*.12);
  right.crossVectors(P,Hd).normalize();
  plane.matrix.makeBasis(right,P,Hd).setPosition(pos); mRoll.makeRotationZ(S.bank); plane.matrix.multiply(mRoll);
  mRoll.makeScale(PS,PS,PS); plane.matrix.multiply(mRoll); plane.matrixWorldNeedsUpdate=true;
  shadow.visible=plane.visible; shadow.position.copy(P).multiplyScalar(R+.25); shadow.quaternion.setFromUnitVectors(ZAX,P);
  // 飛行機雲
  [-1,1].forEach((sg,ti)=>{ const tr=trails[ti]; tA.set(sg*1.05,.1,-.95).applyMatrix4(plane.matrix);
    tr.hist.unshift({c:tA.clone(),r:right.clone()}); if(tr.hist.length>TN) tr.hist.pop();
    for(let i=0;i<TN;i++){ const hh=tr.hist[Math.min(i,tr.hist.length-1)], wd=.085*(1-i/TN)+.012;
      tr.pos[i*6]=hh.c.x+hh.r.x*wd; tr.pos[i*6+1]=hh.c.y+hh.r.y*wd; tr.pos[i*6+2]=hh.c.z+hh.r.z*wd;
      tr.pos[i*6+3]=hh.c.x-hh.r.x*wd; tr.pos[i*6+4]=hh.c.y-hh.r.y*wd; tr.pos[i*6+5]=hh.c.z-hh.r.z*wd; }
    tr.m.geometry.attributes.position.needsUpdate=true; });
}
function resetTrails(){ trails.forEach(t=>t.hist.length=0); }
function startGame(){
  audioInit(); runId++;
  Object.assign(S,{mode:'count',t:0,left:GAME_SEC,w:0,dist:0,steer:0,steerT:0,bank:0,combo:0,comboT:0,maxCombo:0,maxW:0,punch:0,visited:1,slow:1,countN:-1,fin:0});
  P.copy(startP); Hd.copy(startH); buildRings(); resetTrails();
  cities.forEach(c=>{ c.visited=(c.i===0); paintCity(c); });
  camFrom.p.copy(camera.position); camFrom.q.copy(camera.quaternion);
  plane.visible=true; show('title',false); show('result',false); show('hud',true); resize();
  $('#hint').classList.add('on'); $('#timer').classList.remove('hot'); $('#count').className='count'; hud();
}
function setCount(html,cls){ const c=$('#count'); c.className='count'+(cls?' '+cls:''); c.innerHTML=html?`<span>${html}</span>`:''; }
function flash(){ const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function banner(c){ const b=$('#banner'); b.innerHTML=`${c.emoji} ${c.jp}<small>${c.en}</small>`; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function comboPop(){ const c=$('#combo'); c.innerHTML=`×${S.combo}<small>連続</small>`; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
function popAt(r){ const p=pops.find(x=>x.t<=0)||pops[0]; p.t=.35; ringMatrix(r,1,p.base); p.m.visible=true; }
function update(dt){
  S.time+=dt;
  if(S.mode==='title'||S.mode==='result'){ titleCam(S.time); updateRings(S.time); return; }
  S.t+=dt;
  if(S.mode==='count'){
    const n=Math.floor(S.t/.8);
    if(n!==S.countN&&n<3){ S.countN=n; setCount(String(3-n)); sfx.beep(false); }
    const e=clamp(S.t/2.2,0,1), k=e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2;
    chaseCam(0,false);
    camera.position.lerpVectors(camFrom.p,camP,k);
    const keepP=camera.position.clone(); camera.position.copy(camP); camera.up.copy(P); camera.lookAt(camL); qTo.copy(camera.quaternion);
    camera.position.copy(keepP); camera.quaternion.copy(camFrom.q).slerp(qTo,k);
    camera.fov=camera.fov+(fovBase-camera.fov)*Math.min(1,dt*3); camera.updateProjectionMatrix();
    placePlane(); updateRings(S.time);
    if(S.t>=2.4){ S.mode='play'; S.t=0; setCount('GO!','fin'); sfx.beep(true); musicStart(); flash(); S.punch=1; setTimeout(()=>{ if(S.mode==='play') setCount(''); },900); }
    return;
  }
  const g=dt*S.slow;
  if(S.mode==='play'){
    S.left-=dt;
    if(S.left<=10&&!$('#timer').classList.contains('hot')) $('#timer').classList.add('hot');
    if(S.left<=5&&Math.ceil(S.left)!==S.lastBeep){ S.lastBeep=Math.ceil(S.left); if(S.left>0) sfx.beep(false); }
    if(S.t>3.5) $('#hint').classList.remove('on');
    if(S.left<=0){ S.left=0; S.mode='finish'; S.fin=0; S.slow=.22; S.steerT=0; setCount('FINISH!','fin'); sfx.finish(); musicStop(); vib([40,40,120]); }
  }else if(S.mode==='finish'){
    S.fin+=dt; if(S.fin>1.7){ showResult(); return; }
  }
  // 操縦と移動
  S.steer+=(S.steerT-S.steer)*Math.min(1,g*9);
  S.bank+=(S.steer*.95-S.bank)*Math.min(1,g*7);
  if(S.w<BASE_W) S.w=Math.min(BASE_W,S.w+g*.22); else S.w-=(S.w-BASE_W)*.15*g;
  S.w=Math.max(BASE_W*.2,S.w-Math.abs(S.steer)*.012*g);
  Hd.applyAxisAngle(P,-S.steer*TURN*g);
  ax.crossVectors(P,Hd).normalize(); const a=S.w*g; P.applyAxisAngle(ax,a); Hd.applyAxisAngle(ax,a);
  Hd.addScaledVector(P,-Hd.dot(P)).normalize(); P.normalize();
  if(S.mode==='play'){ S.dist+=a; S.maxW=Math.max(S.maxW,S.w); }
  placePlane();
  // リング
  if(S.comboT>0){ S.comboT-=g; if(S.comboT<=0) S.combo=0; }
  for(const r of rings){
    if(r.t>0){ r.t-=g; if(r.t<=0){ r.t=0; } r.s=r.t>0?0:r.s; continue; }
    if(r.s<1) r.s=Math.min(1,r.s+g*2.5);
    if(S.mode==='play'&&r.s>.6){ tA.copy(r.p).multiplyScalar(R+ALT); if(tA.distanceToSquared(pos)<7.3){
      r.t=9; r.s=0; S.combo++; S.comboT=2.4; S.maxCombo=Math.max(S.maxCombo,S.combo);
      S.w=Math.min(MAX_W,S.w+.011+Math.min(S.combo,25)*.0004); S.punch=Math.min(1,S.punch+.5);
      sfx.ring(S.combo-1); popAt(r); if(S.combo>=2) comboPop(); vib(8); } }
  }
  for(const p of pops){ if(p.t>0){ p.t-=g; const k=1-p.t/.35; p.m.matrix.copy(p.base); mRoll.makeScale(1+k*1.6,1+k*1.6,1+k*1.6); p.m.matrix.multiply(mRoll); p.m.matrixWorldNeedsUpdate=true; p.m.material.opacity=(1-k)*.9; if(p.t<=0) p.m.visible=false; } }
  updateRings(S.time);
  // 都市
  if(S.mode==='play') for(const c of cities){ if(!c.visited&&c.p.dot(P)>.9945){ c.visited=true; S.visited++; paintCity(c); S.w=Math.min(MAX_W,S.w+.075); S.punch=1; banner(c); flash(); sfx.city(); vib([20,30,40]); } }
  // カメラ
  const k=clamp((S.w-BASE_W)/(MAX_W-BASE_W),0,1);
  S.punch=Math.max(0,S.punch-g*2.2);
  chaseCam(k,true);
  camera.fov=fovBase+k*22+S.punch*7; camera.updateProjectionMatrix();
  // 速さの線
  const v=S.w*(R+ALT);
  for(let i=0;i<SL;i++){ const d=slD[i]; d.z+=v*g*1.6; if(d.z>4){ d.z=-90; const an=Math.random()*TAU, rr=rnd(4,18); d.x=Math.cos(an)*rr; d.y=Math.sin(an)*rr*.75; }
    const len=1.5+v*.16; slPos[i*6]=d.x; slPos[i*6+1]=d.y; slPos[i*6+2]=d.z; slPos[i*6+3]=d.x; slPos[i*6+4]=d.y; slPos[i*6+5]=d.z-len; }
  slGeo.attributes.position.needsUpdate=true; slMat.opacity=reduce?0:clamp(.1+k*.6,0,.7);
  $('#rush').style.opacity=reduce?0:(k*.9+S.punch*.25).toFixed(2);
  if(ac&&windG){ windG.gain.setTargetAtTime(.04+k*.2,ac.currentTime,.1); windF.frequency.setTargetAtTime(420+k*2400,ac.currentTime,.1); }
  hud();
}
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
let mmTick=0;
function hud(){
  $('#timer').textContent=S.left.toFixed(1);
  $('#laps').textContent=(S.dist/TAU).toFixed(2);
  $('#spd').textContent=fmt(S.w*EARTH_KM);

function drawMini(){
  const c=$('#mm'), W=c.width, H=c.height; if(W<10) return; const g=c.getContext('2d'), s=W/220;
  g.drawImage(mmBase,0,0,W,H);
  for(const ct of cities){ const x=(ct.lon+180)/360*W, y=(90-ct.lat)/180*H; g.beginPath(); g.arc(x,y,(ct.visited?2.2:3.2)*s,0,TAU); g.fillStyle=ct.visited?'rgba(255,255,255,.55)':'#FFD23F'; g.fill(); if(!ct.visited){ g.lineWidth=1*s; g.strokeStyle='rgba(6,21,51,.8)'; g.stroke(); } }
  const ll=v2ll(P), x=(ll[1]+180)/360*W, y=(90-ll[0])/180*H;
  tA.set(P.z,0,-P.x).normalize(); tB.crossVectors(P,tA);
  const ang=Math.atan2(-Hd.dot(tB),Hd.dot(tA));
  g.save(); g.translate(x,y); g.rotate(ang); g.fillStyle='#fff'; g.strokeStyle='#061533'; g.lineWidth=1.6*s; g.beginPath(); g.moveTo(9*s,0); g.lineTo(-6*s,5.5*s); g.lineTo(-3*s,0); g.lineTo(-6*s,-5.5*s); g.closePath(); g.fill(); g.stroke(); g.restore();
}

const INK=['#1F4FA8','#C8372D','#1D7F5F','#7A3FA0','#B5651D'];
function rankOf(l){
  if(l>=4.2) return ['ほぼ光','紙でできているとは、もう誰も信じない。'];
  if(l>=3.8) return ['流れ星','見上げた人が、願いごとを言い終わらない速さ。'];
  if(l>=3.3) return ['音速の紙ヒコーキ','折り方を教えてほしい、と航空会社から連絡が来る。'];
  if(l>=2.8) return ['ジェット気流','風に乗るのがうまい。リングをもっとつなげば、まだ伸びる。'];
  if(l>=2.3) return ['世界一周旅行者','ちゃんと一周して帰ってきた。次は寄り道を減らす。'];
  return ['のんびり遊覧飛行','景色はいちばんよく見えたはず。'];
}

                  :`<div class="st no"><span class="e">${c.emoji}</span><span class="n">${c.en}</span></div>`;
}

async function loadFonts(text){
  if(!document.fonts||!document.fonts.load) return;
  const jobs=['900 40px "M PLUS Rounded 1c"','700 40px "M PLUS Rounded 1c"','italic 800 40px "Barlow Condensed"','italic 600 40px "Barlow Condensed"'].map(f=>document.fonts.load(f,text).catch(()=>{}));
  await Promise.race([Promise.all(jobs),sleep(2500)]);
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
async function makeCard(){
  const f=final; await loadFonts('60秒世界一周紙ヒコーキで世界を周訪れた都市最高速度リング連続本渡航記録称号'+f.rank+'PASSPORT0123456789.,km/秒／#');
  const c=document.createElement('canvas'); c.width=1200; c.height=675; const g=c.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,675); gr.addColorStop(0,'#061533'); gr.addColorStop(1,'#0d3a7e'); g.fillStyle=gr; g.fillRect(0,0,1200,675);
  g.fillStyle='rgba(255,255,255,.7)'; for(let i=0;i<120;i++){ g.fillRect(Math.random()*1200,Math.random()*360,1.6,1.6); }
  g.save(); g.beginPath(); g.arc(250,1180,720,0,TAU); g.clip(); g.drawImage(texCanvas,texCanvas.width*.72,texCanvas.height*.18,texCanvas.width*.2,texCanvas.height*.24,-470,460,1440,720); g.restore();
  gr=g.createRadialGradient(250,1180,700,250,1180,780); gr.addColorStop(0,'rgba(120,200,255,.55)'); gr.addColorStop(1,'rgba(120,200,255,0)'); g.fillStyle=gr; g.beginPath(); g.arc(250,1180,780,0,TAU); g.fill();
  // 左：数字
  g.textBaseline='alphabetic'; g.textAlign='left';
  g.fillStyle='#FFD23F'; g.font='italic 600 22px '+F_NUM; g.fillText('P A P E R   P L A N E   W O R L D   D A S H',60,70);
  g.fillStyle='#fff'; g.font='900 50px '+F_JP; g.fillText('60秒世界一周',58,128);
  g.font='700 24px '+F_JP; g.fillText('紙ヒコーキで世界を',60,190);
  g.fillStyle='#FFD23F'; g.font='italic 800 210px '+F_NUM; const lt=f.laps.toFixed(2); g.fillText(lt,50,366); const lw=g.measureText(lt).width;
  g.fillStyle='#fff'; g.font='900 56px '+F_JP; g.fillText('周',62+lw,362);
  g.font='italic 600 34px '+F_NUM; g.fillText(fmt(f.km)+' km',62,410);
  const st=[['訪れた都市',f.visited+' / '+cities.length],['最高速度','秒速 '+fmt(f.maxKm)+'km'],['リング連続',f.combo+' 本']];
  st.forEach((s,i)=>{ const y=452+i*38; g.fillStyle='rgba(255,255,255,.75)'; g.font='700 19px '+F_JP; g.fillText(s[0],62,y); g.fillStyle='#fff'; g.font='900 24px '+F_JP; g.fillText(s[1],190,y+1); });
  g.save(); g.translate(250,598); g.rotate(-.06); g.font='900 40px '+F_JP; const rw=g.measureText(f.rank).width; g.strokeStyle='#FF5964'; g.lineWidth=5; rr(g,-rw/2-22,-36,rw+44,66,10); g.stroke(); g.lineWidth=1.8; rr(g,-rw/2-30,-44,rw+60,82,13); g.stroke();
  g.fillStyle='#FF5964'; g.textAlign='center'; g.fillText(f.rank,0,12); g.restore();
  // 右：パスポート
  g.save(); g.translate(880,338); g.rotate(.025); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=40; g.shadowOffsetY=14; g.fillStyle='#F5EEDC'; rr(g,-290,-296,580,592,18); g.fill(); g.shadowColor='transparent';
  g.fillStyle='#1b2540'; g.textAlign='left'; g.font='italic 800 30px '+F_NUM; g.fillText('P A S S P O R T',-262,-250);
  g.textAlign='right'; g.font='700 15px '+F_JP; g.fillText('60秒世界一周・渡航記録',262,-252); g.fillRect(-262,-238,524,2.5);
  cities.forEach((ct,i)=>{ const cx=-235+(i%6)*94, cy=-166+Math.floor(i/6)*110, col=INK[i%INK.length];
    g.save(); g.translate(cx,cy); g.textAlign='center';
    if(ct.visited){ g.rotate((((i*37)%23)-11)*Math.PI/180); g.strokeStyle=col; g.lineWidth=3.2; g.beginPath(); g.arc(0,0,42,0,TAU); g.stroke(); g.lineWidth=1.3; g.beginPath(); g.arc(0,0,36.5,0,TAU); g.stroke();
      g.font='29px '+F_JP; g.fillStyle='#000'; g.fillText(ct.emoji,0,3); g.fillStyle=col; g.font='italic 800 '+(ct.en.length>9?9.5:12)+'px '+F_NUM; g.fillText(ct.en,0,23); }
    else { g.setLineDash([4,5]); g.strokeStyle='rgba(27,37,64,.25)'; g.lineWidth=1.6; g.beginPath(); g.arc(0,0,40,0,TAU); g.stroke(); g.fillStyle='rgba(27,37,64,.3)'; g.font='italic 800 '+(ct.en.length>9?9.5:12)+'px '+F_NUM; g.fillText(ct.en,0,5); }
    g.restore(); });
  g.fillStyle='#1b2540'; g.textAlign='left'; g.font='900 22px '+F_JP; g.fillText(TAG,-262,272);
  if(siteUrl()){ g.textAlign='right'; g.font='700 15px '+F_JP; g.fillText(siteUrl().replace(/^https?:\/\//,''),262,272); }
  g.restore();
  return await new Promise(res=>c.toBlob(res,'image/png'));
}

/* ================= 入力 ================= */
let ptr=null; const keys={l:false,r:false};
function steerFrom(x){ const w=window.innerWidth; S.steerT=clamp((x-w/2)/(w*.28),-1,1); if(Math.abs(S.steerT)<.12) S.steerT=0; }
canvas.addEventListener('pointerdown',e=>{ if(S.mode!=='play'&&S.mode!=='count') return; e.preventDefault(); ptr=e.pointerId; try{ canvas.setPointerCapture(ptr); }catch(_){} steerFrom(e.clientX); });
canvas.addEventListener('pointermove',e=>{ if(e.pointerId===ptr) steerFrom(e.clientX); });
['pointerup','pointercancel','lostpointercapture'].forEach(n=>canvas.addEventListener(n,e=>{ if(e.pointerId===ptr){ ptr=null; S.steerT=keys.l?-1:keys.r?1:0; } }));
canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function keySteer(){ S.steerT=(keys.r?1:0)-(keys.l?1:0); }
addEventListener('keydown',e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA'){ keys.l=true; keySteer(); e.preventDefault(); } else if(e.code==='ArrowRight'||e.code==='KeyD'){ keys.r=true; keySteer(); e.preventDefault(); }
  else if((e.code==='Space'||e.code==='Enter')&&S.mode==='title'&&!e.repeat){ e.preventDefault(); startGame(); } });
addEventListener('keyup',e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA'){ keys.l=false; keySteer(); } else if(e.code==='ArrowRight'||e.code==='KeyD'){ keys.r=false; keySteer(); } });
addEventListener('blur',()=>{ keys.l=keys.r=false; ptr=null; S.steerT=0; });
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));
$('#start').addEventListener('click',startGame);
$('#retry').addEventListener('click',startGame);
$('#shareImg').addEventListener('click',shareImg);
$('#mute').addEventListener('click',()=>{ muted=!muted; if(master) master.gain.value=muted?0:.9; const b=$('#mute'); b.textContent=muted?'音 OFF':'音 ON'; b.setAttribute('aria-pressed',String(muted)); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(ac) ac.suspend(); } else if(ac) ac.resume(); });

/* ================= 起動 ================= */
let last=0;
function frame(now){ const dt=Math.min(.05,(now-last)/1000||0); last=now; update(dt); renderer.render(scene,camera); requestAnimationFrame(frame); }
(async()=>{
  resize(); buildRings(); updateRings(0); showBest(); plane.visible=false; titleCam(0);
  requestAnimationFrame(frame);
  await loadFonts('60秒世界一周周秒速都市'+CITIES.map(c=>c[0]+c[1]).join(''));
  buildCities(); cities.forEach(c=>{ c.visited=(c.i===0); paintCity(c); });
  try{
    const res=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json'); const topo=await res.json();
    drawWorld(topoPolys(topo,'land'),topoPolys(topo,'countries')); tex.needsUpdate=true;
  }catch(e){ /* 通信できないときは、おおまかな大陸のまま遊べる */ }
  $('#loading').textContent='';
})();
})();
</script>
